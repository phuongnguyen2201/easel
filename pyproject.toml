[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "easel"
version = "0.1.0"
description = "社媒内容工作流整合层 — Easel CLI"
requires-python = ">=3.10"
# Phụ thuộc lõi: đủ để chạy Web workbench + CLI.
# Xử lý media và phát hành qua trình duyệt tách sang extras "media" / "browser"
# bên dưới; setup.sh cài "-e .[media,browser]" nên bản cài mặc định không đổi.
dependencies = [
    "fastapi>=0.115,<1",          # Web backend
    "uvicorn>=0.30,<1",           # ASGI server (easel web)
    "sse-starlette>=2.1,<4",      # SSE cho luồng hội thoại
    "pydantic>=2.7,<3",           # Model request
    "python-multipart>=0.0.9,<1", # Upload file / Form của FastAPI
    "markdown>=3.5,<4",
    # Cầu ask_user (easel/gateway_questions.py): nối WS RPC của gateway local
    # + ký thiết bị Ed25519. Chỉ dùng load_pem_private_key + Ed25519.sign (API
    # ổn định lâu dài); chặn trên ở major kế tiếp để một bản breaking của
    # cryptography không âm thầm lọt vào (mới nhất trên PyPI: 50.0.1).
    "websocket-client>=1.7,<2",
    "cryptography>=42,<51",
    "segno>=1.6,<2",              # QR đăng nhập thiết bị (facebook_publish.py login)
]

[project.optional-dependencies]
# Lớp produce: ảnh / video / âm thanh cho skills/shared/scripts/*.
media = [
    "Pillow>=10,<13",
    "opencv-python>=4.8,<5",
    "numpy>=1.26,<3",
    "pandas>=2,<4",
    "matplotlib>=3.8,<4",
    "librosa>=0.10,<1",
    "faster-whisper>=1,<2",
    "edge-tts>=6,<8",
    "rembg>=2.0,<3",
]
# Đăng nhập / phát hành qua trình duyệt (login runner, web_publisher)
# và check Chromium trong `easel doctor`.
browser = [
    "playwright>=1.45,<2",
]

[project.scripts]
easel = "easel.cli:main"

[tool.setuptools.packages.find]
include = ["easel*"]
